<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cİ</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f8f6f2;
  color: #222;
}

.app {
  max-width: 430px;
  min-height: 100vh;
  margin: auto;
  padding: 25px 20px 100px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 35px;
}

.logo {
  font-size: 30px;
  font-weight: bold;
}

.profile {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: #222;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.small {
  color: #777;
  font-size: 14px;
  margin-bottom: 8px;
}

h1 {
  font-size: 30px;
  margin-bottom: 25px;
}

.days {
  background: #222;
  color: white;
  border-radius: 25px;
  padding: 28px;
  margin-bottom: 20px;
}

.days-number {
  font-size: 55px;
  font-weight: bold;
}

.days-text {
  color: #ccc;
  margin-top: 5px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.card {
  background: white;
  border-radius: 22px;
  padding: 22px;
  min-height: 130px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.05);
}

.card h3 {
  margin-bottom: 10px;
}

.card p {
  color: #777;
  font-size: 14px;
}

.note {
  margin-top: 15px;
  background: #eee8df;
  border-radius: 22px;
  padding: 22px;
}

.bottom {
  position: fixed;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 30px);
  max-width: 400px;
  background: #222;
  color: white;
  border-radius: 25px;
  display: flex;
  justify-content: space-around;
  padding: 15px 5px;
}

.bottom div {
  font-size: 12px;
  text-align: center;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">Cİ</div>
    <div class="profile">A</div>
  </div>

  <div class="small">Birlikte geçen zaman</div>
  <h1>Bizim hikâyemiz.</h1>

  <div class="days">
    <div class="days-number">0</div>
    <div class="days-text">gündür birlikte</div>
  </div>

  <div class="grid">

    <div class="card">
      <h3>♡ Anılar</h3>
      <p>Birlikte yaşadığınız güzel anıları saklayın.</p>
    </div>

    <div class="card">
      <h3>✎ Not bırak</h3>
      <p>Birbirinize küçük notlar bırakın.</p>
    </div>

  </div>

  <div class="note">
    <div class="small">Bugünün notu</div>
    <p>“Seninle geçen her gün, hikâyemizin yeni bir sayfası.”</p>
  </div>

</div>

<div class="bottom">
  <div>⌂<br>Ana Sayfa</div>
  <div>♡<br>Anılar</div>
  <div>✎<br>Notlar</div>
  <div>☻<br>Biz</div>
</div>

</body>
</html>
